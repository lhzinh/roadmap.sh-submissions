[project]
name = "engineering_team"
version = "0.1.0"
description = "engineering_team using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.22,<2.0.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
kickoff = "engineering_team.main:kickoff"
run_crew = "engineering_team.main:kickoff"
plot = "engineering_team.main:plot"
run_with_trigger = "engineering_team.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "27db479a-d195-4ec8-be9e-4ee966c79cee"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
